name: Termux Android source build

on:
  push:
    branches: ["termux/**"]
    paths:
      - ".github/workflows/termux-build.yml"
      - "scripts/termux/**"
      - "scripts/termux_smoke.py"
      - "patches/termux-rusty-v8-bindgen.patch"
      - "codex-rs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: termux-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android-arm64:
    runs-on: ubuntu-26.04
    timeout-minutes: 240
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      TERMUX_NDK_VERSION: "28.2.13676358"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Check source preparation retries and package contents
        run: python3 -m unittest discover -s scripts/termux -p 'test_*.py' -v
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          toolchain: 1.95.0
          targets: aarch64-linux-android
      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-21-dev clang-21 ninja-build pkg-config libssl-dev cmake
      - name: Check pinned Android toolchain and SDK
        run: |
          "${ANDROID_HOME:?}/cmdline-tools/latest/bin/sdkmanager" "ndk;${TERMUX_NDK_VERSION}" "platforms;android-37.0" "build-tools;37.0.0"
          test -x "${ANDROID_HOME}/ndk/${TERMUX_NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang"
          df -h "${RUNNER_TEMP}"
      - name: Check out pinned V8 sources and Android dependencies
        run: >-
          python3 scripts/termux/build.py prepare
          --work-dir "${RUNNER_TEMP}/termux-native"
          --ndk "${ANDROID_HOME}/ndk/${TERMUX_NDK_VERSION}" --sdk "${ANDROID_HOME}"
      - name: Select cache by V8 build inputs
        id: v8-inputs
        run: >-
          python3 scripts/termux/build.py cache-key
          --work-dir "${RUNNER_TEMP}/termux-native"
          --ndk "${ANDROID_HOME}/ndk/${TERMUX_NDK_VERSION}" --sdk "${ANDROID_HOME}"
          >> "${GITHUB_OUTPUT}"
      - name: Restore this repository's matching V8 pair
        id: v8-cache
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          key: ${{ steps.v8-inputs.outputs.key }}
          path: |
            ${{ runner.temp }}/termux-native/v8-target/aarch64-linux-android/release/gn_out/obj/librusty_v8.a
            ${{ runner.temp }}/termux-native/v8-target/aarch64-linux-android/release/gn_out/src_binding.rs
            ${{ runner.temp }}/termux-native/v8-target/aarch64-linux-android/release/gn_out/args.gn
            ${{ runner.temp }}/termux-native/v8-target/aarch64-linux-android/release/gn_out/v8-build.json
      - name: Build V8 with pointer compression and sandbox
        if: steps.v8-cache.outputs.cache-hit != 'true'
        run: >-
          python3 scripts/termux/build.py v8
          --work-dir "${RUNNER_TEMP}/termux-native"
          --ndk "${ANDROID_HOME}/ndk/${TERMUX_NDK_VERSION}" --sdk "${ANDROID_HOME}"
      - name: Retain only the reusable V8 pair and its checksums
        if: steps.v8-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          key: ${{ steps.v8-cache.outputs.cache-primary-key }}
          path: |
            ${{ runner.temp }}/termux-native/v8-target/aarch64-linux-android/release/gn_out/obj/librusty_v8.a
            ${{ runner.temp }}/termux-native/v8-target/aarch64-linux-android/release/gn_out/src_binding.rs
            ${{ runner.temp }}/termux-native/v8-target/aarch64-linux-android/release/gn_out/args.gn
            ${{ runner.temp }}/termux-native/v8-target/aarch64-linux-android/release/gn_out/v8-build.json
      - name: Build Codex and its code-mode host for Bionic
        run: >-
          python3 scripts/termux/build.py codex
          --work-dir "${RUNNER_TEMP}/termux-native"
          --ndk "${ANDROID_HOME}/ndk/${TERMUX_NDK_VERSION}" --sdk "${ANDROID_HOME}"
      - name: Check ELF dependencies and package candidate
        run: >-
          python3 scripts/termux/build.py package
          --work-dir "${RUNNER_TEMP}/termux-native"
          --ndk "${ANDROID_HOME}/ndk/${TERMUX_NDK_VERSION}" --sdk "${ANDROID_HOME}"
      - name: Upload candidate only
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: codex-termux-native-android-arm64-candidate
          path: |
            ${{ runner.temp }}/termux-native/codex-termux-native-android-arm64.tar.gz
            ${{ runner.temp }}/termux-native/codex-termux-native-android-arm64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
