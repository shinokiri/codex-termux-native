name: Termux formatting and build-script checks

on:
  push:
    branches: ["termux/**"]
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:
  workflow_call:
    inputs:
      source_ref:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: termux-format-${{ inputs.source_ref || github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: just@1.51.0
      - uses: facebook/install-dotslash@1e4e7b3e07eaca387acb98f1d4720e0bee8dbb6a # v2
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.3"
      - name: Validate Termux workflow wiring
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint" .github/workflows/termux-*.yml
      - name: Check out the prepared release source
        if: inputs.source_ref != ''
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - name: Test build preparation retries and package contents
        run: python3 -m unittest discover -s scripts/termux -p 'test_*.py' -v
      - name: Test the shared standalone installer
        run: python3 -m unittest discover -s scripts/install -p 'test_install_sh.py' -v
      - name: Format repository
        if: always() && !cancelled()
        run: just fmt
      - name: Check generated changes
        if: always() && !cancelled()
        run: |
          git diff --binary > "${RUNNER_TEMP}/termux-format.patch"
          git diff --exit-code
      - name: Retain formatting corrections for review
        if: failure()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: termux-format-corrections
          path: ${{ runner.temp }}/termux-format.patch
          if-no-files-found: ignore
          retention-days: 3

  recover-publish:
    # One-time recovery of the validated revision; remove after publication.
    needs: format
    if: github.event_name == 'push' && github.ref == 'refs/heads/termux/native'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    concurrency:
      group: termux-release-channel
      cancel-in-progress: false
    env:
      TERMUX_RELEASE_RUN: "34119609682"
      TERMUX_RELEASE_SOURCE: "628e04690892926ae683d00c279df3b91f3864af"
      TERMUX_RELEASE_VERSION: "0.153.4+termux.2"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Confirm all original build and regression gates passed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os
          from scripts.termux.release import GitHub
          api = GitHub(os.environ["GH_TOKEN"])
          path = "actions/runs/" + os.environ["TERMUX_RELEASE_RUN"]
          run = api.repo(path)
          if (
              run["status"] != "completed"
              or run["path"] != ".github/workflows/termux-release.yml"
              or run["head_sha"] != "191bc0da89e9f408d2e13a09d3f408a44bdcd37f"
          ):
              raise RuntimeError("Unexpected build run")
          jobs = api.repo(path + "/jobs?filter=latest&per_page=100")["jobs"]
          passed = {job["name"] for job in jobs if job["conclusion"] == "success"}
          required = {
              "prepare", "format / format", "regression / resume-tests",
              "native / file-locks", "native / bazel-lock", "android / android-arm64",
          }
          if not required <= passed:
              raise RuntimeError("Required gates did not pass: " + str(required - passed))
          print("Verified all six original preparation, test and build gates.")
          PY
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.TERMUX_RELEASE_RUN }}
          name: codex-termux-native-android-arm64-candidate
          path: ${{ runner.temp }}/termux-release-artifact
      - name: Publish the existing verified package with the corrected controller
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/termux/release.py publish
          --artifact-dir "$RUNNER_TEMP/termux-release-artifact"
          --version "$TERMUX_RELEASE_VERSION" --source-ref "$TERMUX_RELEASE_SOURCE"
