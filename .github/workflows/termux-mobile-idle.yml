name: Termux transport and telemetry checks

on:
  push:
    branches: ["termux/**"]
    paths:
      - ".github/workflows/termux-mobile-idle.yml"
      - "codex-rs/codex-api/**"
      - "codex-rs/otel/**"
      - "codex-rs/core/**"
  workflow_dispatch:
  workflow_call:
    inputs:
      source_ref:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: termux-mobile-idle-${{ inputs.source_ref || github.ref }}
  cancel-in-progress: true

jobs:
  transport-tests:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      CARGO_BUILD_JOBS: "4"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: "env -u CODEX_CA_CERTIFICATE -u SSL_CERT_FILE -u SSL_CERT_DIR"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          toolchain: 1.95.0
          components: clippy,rustfmt
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: just@1.51.0,nextest@0.9.143
      - uses: facebook/install-dotslash@1e4e7b3e07eaca387acb98f1d4720e0bee8dbb6a # v2
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.3"
      - name: Verify upstream transport and mobile telemetry behavior
        run: just test --locked -p codex-api -p codex-otel
      - name: Check affected transport and telemetry crates
        run: |
          just fix -p codex-api --locked --lib
          just fix -p codex-otel --locked --lib
      - name: Format the final changes
        run: just fmt
      - name: Retain corrections for review
        if: always() && !cancelled()
        run: |
          git diff --binary > "${RUNNER_TEMP}/mobile-idle-corrections.patch"
          git diff --exit-code
      - name: Upload corrections
        if: failure()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: termux-mobile-idle-corrections
          path: ${{ runner.temp }}/mobile-idle-corrections.patch
          if-no-files-found: ignore
          retention-days: 3
