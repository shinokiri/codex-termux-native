name: Termux native checks

on:
  push:
    branches: ["termux/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: termux-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  file-locks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          toolchain: 1.95.0
          components: clippy,rustfmt
          targets: aarch64-linux-android
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: just@1.51.0,nextest@0.9.143
      - uses: facebook/install-dotslash@1e4e7b3e07eaca387acb98f1d4720e0bee8dbb6a # v2
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.3"
      - name: Verify workspace manifests
        run: python3 .github/scripts/verify_cargo_workspace_manifests.py
      - name: Test kernel locks and existing HTTP certificate policy
        id: tests
        continue-on-error: true
        run: |
          python3 -c 'import os; print({name: bool(os.environ.get(name)) for name in ("CODEX_CA_CERTIFICATE", "SSL_CERT_FILE", "SSL_CERT_DIR")})'
          env -u CODEX_CA_CERTIFICATE -u SSL_CERT_FILE -u SSL_CERT_DIR just test --locked -p codex-utils-file-lock -p codex-http-client
      - name: Diagnose TLS feature selection after a test failure
        if: steps.tests.outcome == 'failure'
        working-directory: codex-rs
        run: |
          cargo tree --locked -p codex-http-client -e features -i reqwest@0.12.28
          python3 -c 'import os; from pathlib import Path; p = next((Path(os.environ["CARGO_HOME"]) / "registry/src").glob("*/reqwest-0.12.28/src/tls.rs")); s = p.read_text(); i = s.index("impl Default for TlsBackend"); print(s[i:i+650])'
      - name: Compare failing TLS scenarios against the official baseline
        if: steps.tests.outcome == 'failure'
        continue-on-error: true
        run: |
          git fetch --depth=1 origin ac192cd7937b0d73edc6dffe009940ae53782dd4
          git worktree add --detach "${RUNNER_TEMP}/official-baseline" FETCH_HEAD
          cd "${RUNNER_TEMP}/official-baseline"
          env -u CODEX_CA_CERTIFICATE -u SSL_CERT_FILE -u SSL_CERT_DIR CARGO_TARGET_DIR="${GITHUB_WORKSPACE}/codex-rs/target" just test --locked -p codex-http-client --lib -E 'test(tls_fallback_tests::) | test(request_failures_classify_real_untrusted_certificate_handshakes)'
      - name: Trace TLS construction in the temporary baseline only
        if: steps.tests.outcome == 'failure'
        continue-on-error: true
        run: |
          cd "${RUNNER_TEMP}/official-baseline"
          python3 - <<'PY'
          from pathlib import Path
          path = Path("codex-rs/http-client/src/custom_ca.rs")
          source = path.read_text()
          needle = "    if let Some(bundle) = env_source.configured_ca_bundle() {"
          assert source.count(needle) == 1
          trace = '    eprintln!("TLS_DIAGNOSTIC builder={builder:?} custom_ca={}", env_source.configured_ca_bundle().is_some());\n'
          path.write_text(source.replace(needle, trace + needle))
          PY
          env -u CODEX_CA_CERTIFICATE -u SSL_CERT_FILE -u SSL_CERT_DIR CARGO_TARGET_DIR="${GITHUB_WORKSPACE}/codex-rs/target" just test --locked -p codex-http-client --lib -E 'test(retries_a_native_tls_protocol_failure_once_with_rustls)' --no-capture
      - name: Check the device network probe
        working-directory: codex-rs
        run: cargo check --locked -p codex-http-client --example termux_probe
      - name: Check Android lock and PTY API compilation
        working-directory: codex-rs
        run: cargo check --locked -p codex-utils-file-lock -p codex-utils-pty --tests --target aarch64-linux-android
      - name: Apply targeted Clippy fixes
        run: just fix -p codex-utils-file-lock -p codex-http-client --locked --examples
      - name: Format repository
        run: just fmt
      - name: Check generated changes
        run: |
          git diff --binary > "${RUNNER_TEMP}/termux-format.patch"
          git diff --exit-code
          test "${{ steps.tests.outcome }}" = "success"
      - name: Retain formatting corrections for review
        if: failure()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: termux-format-corrections
          path: ${{ runner.temp }}/termux-format.patch
          if-no-files-found: ignore
          retention-days: 3

  bazel-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: just@1.51.0
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-version: 1.28.1
      - name: Refresh Bazel dependency lock
        run: just bazel-lock-update
      - name: Check lockfile changes
        run: |
          git diff --binary -- MODULE.bazel.lock > "${RUNNER_TEMP}/termux-bazel-lock.patch"
          git diff --exit-code -- MODULE.bazel.lock
      - name: Retain lockfile corrections for review
        if: failure()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: termux-bazel-lock-corrections
          path: ${{ runner.temp }}/termux-bazel-lock.patch
          if-no-files-found: ignore
          retention-days: 3
