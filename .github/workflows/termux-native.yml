name: Termux native checks

on:
  push:
    branches: ["termux/**"]
    paths-ignore:
      - "TERMUX.md"
      - ".github/workflows/termux-build.yml"
      - ".github/workflows/termux-release.yml"
      - ".github/workflows/termux-upstream.yml"
      - "scripts/termux/**"
  workflow_dispatch:
  workflow_call:
    inputs:
      source_ref:
        required: true
        type: string
      skip_android_cli:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: termux-native-${{ inputs.source_ref || github.ref }}
  cancel-in-progress: true

jobs:
  android-cli:
    if: ${{ !inputs.skip_android_cli }}
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      TERMUX_NDK_VERSION: "28.2.13676358"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          toolchain: 1.95.0
          targets: aarch64-linux-android
      - name: Install the pinned NDK
        run: '"${ANDROID_HOME:?}/cmdline-tools/latest/bin/sdkmanager" "ndk;${TERMUX_NDK_VERSION}"'
      - name: Build Android CLI and network probe without waiting for V8
        run: >-
          python3 scripts/termux/build.py cli
          --work-dir "${RUNNER_TEMP}/termux-native"
          --ndk "${ANDROID_HOME}/ndk/${TERMUX_NDK_VERSION}" --sdk "${ANDROID_HOME}"
          --jobs 4

  file-locks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      # Scrub at the test-process boundary: Cargo/nextest may set SSL_CERT_FILE
      # after the outer shell was scrubbed, selecting custom-CA Rustls instead.
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: "env -u CODEX_CA_CERTIFICATE -u SSL_CERT_FILE -u SSL_CERT_DIR"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          toolchain: 1.95.0
          components: clippy,rustfmt
          targets: aarch64-linux-android
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: just@1.51.0,nextest@0.9.143
      - uses: facebook/install-dotslash@1e4e7b3e07eaca387acb98f1d4720e0bee8dbb6a # v2
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.3"
      - name: Verify workspace manifests
        run: python3 .github/scripts/verify_cargo_workspace_manifests.py
      - name: Test locks, HTTP, shell and keyring behavior
        id: tests
        continue-on-error: true
        run: |
          env -u CODEX_CA_CERTIFICATE -u SSL_CERT_FILE -u SSL_CERT_DIR just test --locked -p codex-utils-file-lock -p codex-http-client -p codex-shell-command -p codex-keyring-store
      - name: Test existing MCP credential fallback and deletion
        run: >-
          just test --locked -p codex-rmcp-client --lib
          -E 'test(oauth::tests::load_oauth_tokens_falls_back_when_missing_in_keyring)
          or test(oauth::tests::save_oauth_tokens_writes_fallback_when_keyring_fails)
          or test(oauth::tests::delete_oauth_tokens_removes_all_storage)
          or test(oauth::tests::delete_oauth_tokens_propagates_keyring_errors)'
      - name: Check the device network probe
        working-directory: codex-rs
        run: cargo check --locked -p codex-http-client --example termux_probe
      - name: Check Android lock, PTY and keyring compilation
        working-directory: codex-rs
        run: cargo check --locked -p codex-utils-file-lock -p codex-utils-pty -p codex-keyring-store --tests --target aarch64-linux-android
      - name: Apply targeted Clippy fixes
        run: just fix -p codex-utils-file-lock -p codex-http-client -p codex-shell-command -p codex-keyring-store --locked --examples
      - name: Format repository
        run: just fmt
      - name: Check generated changes
        run: |
          git diff --binary > "${RUNNER_TEMP}/termux-format.patch"
          git diff --exit-code
          test "${{ steps.tests.outcome }}" = "success"
      - name: Retain formatting corrections for review
        if: failure()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: termux-format-corrections
          path: ${{ runner.temp }}/termux-format.patch
          if-no-files-found: ignore
          retention-days: 3

  bazel-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: just@1.51.0
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-version: 1.28.1
      - name: Refresh Bazel dependency lock
        run: just bazel-lock-update
      - name: Check lockfile changes
        run: |
          git diff --binary -- MODULE.bazel.lock > "${RUNNER_TEMP}/termux-bazel-lock.patch"
          git diff --exit-code -- MODULE.bazel.lock
      - name: Retain lockfile corrections for review
        if: failure()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: termux-bazel-lock-corrections
          path: ${{ runner.temp }}/termux-bazel-lock.patch
          if-no-files-found: ignore
          retention-days: 3
