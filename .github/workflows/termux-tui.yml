name: Termux CLI regression checks

on:
  push:
    branches: ["termux/**"]
    paths:
      - ".github/workflows/termux-tui.yml"
      - "codex-rs/tui/**"
      - "codex-rs/exec/**"
      - "codex-rs/cli/**"
      - "codex-rs/install-context/**"
  workflow_dispatch:
  workflow_call:
    inputs:
      source_ref:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: termux-tui-${{ inputs.source_ref || github.ref }}
  cancel-in-progress: true

jobs:
  resume-tests:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      CARGO_BUILD_JOBS: "4"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: "env -u CODEX_CA_CERTIFICATE -u SSL_CERT_FILE -u SSL_CERT_DIR"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          toolchain: 1.95.0
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: just@1.51.0,nextest@0.9.143
      - name: Test exec behavior and CLI and TUI session resume
        run: >-
          just test --locked -p codex-exec -p codex-cli -p codex-tui -p codex-install-context --lib --bin codex
          -E 'package(codex-exec)
          or package(codex-install-context)
          or (package(codex-cli) and (test(resume) or test(update)))
          or (package(codex-tui) and
            (test(session_resume::tests::) or test(update_action::tests::)
              or test(update_versions::tests::) or test(updates_cache::tests::)
              or test(update_prompt::tests::)))'
      - name: Test the update command entry point
        run: just test --locked -p codex-cli --test update
      - name: Check update-channel helpers with Clippy
        run: just fix -p codex-install-context --locked --lib
      - name: Check generated changes
        run: git diff --exit-code
