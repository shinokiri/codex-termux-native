name: Termux WebSocket regression checks

on:
  push:
    branches: ["termux/**"]
    paths:
      - ".github/workflows/termux-websocket.yml"
      - "codex-rs/core/**"
      - "codex-rs/codex-api/**"
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Prepared source commit to validate"
        required: false
        type: string
  workflow_call:
    inputs:
      source_ref:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: termux-websocket-${{ inputs.source_ref || github.ref }}
  cancel-in-progress: true

jobs:
  websocket-tests:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      CARGO_BUILD_JOBS: "4"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: "env -u CODEX_CA_CERTIFICATE -u SSL_CERT_FILE -u SSL_CERT_DIR"
      # The assert_cmd fallback sees the runner's `env` command instead of the host.
      CARGO_BIN_EXE_codex_code_mode_host: ${{ github.workspace }}/codex-rs/target/debug/codex-code-mode-host
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - name: Record the tested source
        run: git rev-parse HEAD
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          toolchain: 1.95.0
          components: clippy,rustfmt
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: just@1.51.0,nextest@0.9.143
      - name: Configure verified V8 artifacts for the Code Mode host
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: x86_64-unknown-linux-gnu
      - name: Build the Code Mode host used by integration tests
        working-directory: codex-rs
        run: |
          cargo build --locked --profile test -p codex-code-mode-host --bin codex-code-mode-host
          test -x "$CARGO_BIN_EXE_codex_code_mode_host"
      - name: Test transport recovery and existing retry behavior
        run: >-
          just test --locked -p codex-core --lib --test all
          -E '(test(websocket) or test(responses_retry) or test(retry_after))
          and not test(websocket_recovery::)'
      - name: Require the recovery scenarios to run
        # A missing recovery module must fail instead of passing the older suite alone.
        run: >-
          just test --locked -p codex-core --lib --test all
          -E 'test(websocket_recovery::)'
      - name: Check the affected crate with Clippy
        run: just fix -p codex-core --locked --lib
      - name: Check generated changes
        run: |
          git diff --binary > "${RUNNER_TEMP}/termux-websocket.patch"
          git diff --exit-code
      - name: Retain corrections for review
        if: failure()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: termux-websocket-corrections
          path: ${{ runner.temp }}/termux-websocket.patch
          if-no-files-found: ignore
          retention-days: 3
